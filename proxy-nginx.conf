user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    client_max_body_size 200M;
    client_body_buffer_size 128k;
    client_header_buffer_size 16k;
    large_client_header_buffers 4 64k;

    resolver 127.0.0.11 ipv6=off valid=30s;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/atom+xml
        application/ld+json
        application/manifest+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-font-opentype
        font/opentype
        font/ttf
        font/eot
        font/otf
        image/svg+xml
        image/x-icon;

    # Proxy buffers
    proxy_buffer_size 16k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map "$scheme:$http_x_forwarded_proto" $chatcase_hsts_header {
        default "";
        "~^https:" "max-age=15552000; includeSubDomains";
        "~^http:https$" "max-age=15552000; includeSubDomains";
    }

    map $request_uri $chatcase_app_csp {
        default "";
        "~^/(dashboard|chat|cds)(/|$)" "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://client.sleekplan.com https://api-client.sleekplan.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss: ws:; frame-src 'self' blob: data: https://sleekplan.com https://*.sleekplan.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'";
    }

    limit_req_status 429;
    limit_req_log_level warn;
    limit_req_zone $binary_remote_addr zone=chatcase_api_per_ip:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=chatcase_chatapi_per_ip:10m rate=20r/s;

    server {
        listen 80;
        absolute_redirect off;

        set $upstream_dashboard http://dashboard:80;
        set $upstream_cds http://cds:80;
        set $upstream_ionic http://ionic:80;
        set $upstream_server http://server:3000;
        set $upstream_webwidget http://webwidget:80;
        set $upstream_chatapi http://chat21httpserver:8004;
        set $upstream_rabbitmq_ws http://rabbitmq:15675;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security $chatcase_hsts_header always;
        add_header Content-Security-Policy $chatcase_app_csp always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location = /community {
            return 301 /community/;
        }

        # Public legal pages required by Meta review and LGPD.
        location = /privacy {
            root /usr/share/nginx/html/legal;
            try_files /privacy/index.html =404;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Strict-Transport-Security $chatcase_hsts_header always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
            add_header X-Frame-Options "DENY" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location /privacy/ {
            root /usr/share/nginx/html/legal;
            try_files $uri $uri/ /privacy/index.html;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Strict-Transport-Security $chatcase_hsts_header always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
            add_header X-Frame-Options "DENY" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location = /privacy-policy {
            return 301 /privacy;
        }

        location = /terms {
            root /usr/share/nginx/html/legal;
            try_files /terms/index.html =404;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Strict-Transport-Security $chatcase_hsts_header always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
            add_header X-Frame-Options "DENY" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location /terms/ {
            root /usr/share/nginx/html/legal;
            try_files $uri $uri/ /terms/index.html;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Strict-Transport-Security $chatcase_hsts_header always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
            add_header X-Frame-Options "DENY" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location = /terms-and-conditions {
            return 301 /terms;
        }

        location = /data-deletion {
            root /usr/share/nginx/html/legal;
            try_files /data-deletion/index.html =404;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Strict-Transport-Security $chatcase_hsts_header always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
            add_header X-Frame-Options "DENY" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location /data-deletion/ {
            root /usr/share/nginx/html/legal;
            try_files $uri $uri/ /data-deletion/index.html;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Strict-Transport-Security $chatcase_hsts_header always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
            add_header X-Frame-Options "DENY" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location = /data-deletion-instructions {
            return 301 /data-deletion;
        }

        location / {
            return 301 /dashboard/;
        }

        # Public ChatCase template community.
        location /community/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /community/index.html;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Strict-Transport-Security $chatcase_hsts_header always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location ~* ^/community/assets/.*\.(js|css|svg|png|jpg|jpeg|webp|gif|ico)$ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Strict-Transport-Security $chatcase_hsts_header always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Dashboard
        location /dashboard/ {
            rewrite ^/dashboard/(.*)$ /$1 break;
            proxy_pass $upstream_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie "";
            proxy_set_header Connection "";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Strict-Transport-Security $chatcase_hsts_header always;
            add_header Content-Security-Policy $chatcase_app_csp always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";

            location ~* /dashboard/.*\.(js|css|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
                rewrite ^/dashboard/(.*)$ /$1 break;
                proxy_pass $upstream_dashboard;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header Cookie "";
                proxy_set_header Connection "";
                add_header X-Content-Type-Options "nosniff" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
                add_header Strict-Transport-Security $chatcase_hsts_header always;
                add_header Content-Security-Policy $chatcase_app_csp always;
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header Cache-Control "public, max-age=31536000, immutable";
                access_log off;
            }
        }

        # Design Studio
        location /cds/ {
            rewrite ^/cds/(.*)$ /$1 break;
            proxy_pass $upstream_cds;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie "";
            proxy_set_header Connection "";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Strict-Transport-Security $chatcase_hsts_header always;
            add_header Content-Security-Policy $chatcase_app_csp always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";

            location ~* /cds/.*\.(js|css|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
                rewrite ^/cds/(.*)$ /$1 break;
                proxy_pass $upstream_cds;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header Cookie "";
                proxy_set_header Connection "";
                add_header X-Content-Type-Options "nosniff" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
                add_header Strict-Transport-Security $chatcase_hsts_header always;
                add_header Content-Security-Policy $chatcase_app_csp always;
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header Cache-Control "public, max-age=31536000, immutable";
                access_log off;
            }
        }

        # Chat (ionic)
        location = /chat/ {
            if ($arg_v = "") {
                return 302 /chat/?v=chatcase-20260524-locale;
            }

            proxy_pass $upstream_ionic/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie "";
            proxy_set_header Connection "";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Strict-Transport-Security $chatcase_hsts_header always;
            add_header Content-Security-Policy $chatcase_app_csp always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location /chat/ {
            rewrite ^/chat/(.*)$ /$1 break;
            proxy_pass $upstream_ionic;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie "";
            proxy_set_header Connection "";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Strict-Transport-Security $chatcase_hsts_header always;
            add_header Content-Security-Policy $chatcase_app_csp always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";

            location ~* /chat/.*\.(js|css|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
                rewrite ^/chat/(.*)$ /$1 break;
                proxy_pass $upstream_ionic;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header Cookie "";
                proxy_set_header Connection "";
                add_header X-Content-Type-Options "nosniff" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
                add_header Strict-Transport-Security $chatcase_hsts_header always;
                add_header Content-Security-Policy $chatcase_app_csp always;
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
                access_log off;
            }
        }

        # API
        location /api/ {
            limit_req zone=chatcase_api_per_ip burst=40 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $upstream_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Public backend modules (CaseZap webhooks and channel callbacks)
        location /modules/ {
            proxy_pass $upstream_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Internal incident automation webhook receiver.
        # Public path lets Sentry issue alerts reach the local automation flow over HTTPS in production.
        location /automation/ {
            rewrite ^/automation/(.*)$ /$1 break;
            proxy_pass http://incident-automation:8787;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # WebSocket - server
        location /ws/ {
            rewrite ^/ws/(.*)$ /$1 break;
            proxy_pass $upstream_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /config.json {
            proxy_pass $upstream_server/chat21/config;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            add_header Cache-Control "public, max-age=300";
        }

        # Widget com CORS
        location /widget/ {
            if ($request_method = OPTIONS) {
                return 204;
            }

            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Max-Age 3600;
            add_header Access-Control-Expose-Headers Content-Length;
            add_header Access-Control-Allow-Headers Range;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Strict-Transport-Security $chatcase_hsts_header always;

            rewrite ^/widget/(.*)$ /$1 break;
            proxy_pass $upstream_webwidget;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";

            location ~* /widget/.*\.(js|css|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
                rewrite ^/widget/(.*)$ /$1 break;
                proxy_pass $upstream_webwidget;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header Connection "";
                add_header Cache-Control "public, max-age=86400";
                add_header Access-Control-Allow-Origin *;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
                add_header Strict-Transport-Security $chatcase_hsts_header always;
                access_log off;
            }
        }

        location /widget-config.json {
            proxy_pass $upstream_webwidget/widget-config.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        location /firebase-messaging-sw.js {
            proxy_pass $upstream_ionic/firebase-messaging-sw.js;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        # Chat API
        location /chatapi/ {
            limit_req zone=chatcase_chatapi_per_ip burst=80 nodelay;
            rewrite ^/chatapi/(.*)$ /$1 break;
            proxy_pass $upstream_chatapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # MQTT WebSocket - RabbitMQ
        location /mqws/ {
            rewrite ^/mqws/(.*)$ /$1 break;
            proxy_pass $upstream_rabbitmq_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
        }
    }
}
