user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    client_max_body_size 200M;
    client_body_buffer_size 128k;

    resolver 127.0.0.11 ipv6=off valid=30s;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/atom+xml
        application/ld+json
        application/manifest+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-font-opentype
        font/opentype
        font/ttf
        font/eot
        font/otf
        image/svg+xml
        image/x-icon;

    # Proxy buffers
    proxy_buffer_size 16k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        absolute_redirect off;

        location / {
            return 301 /dashboard/;
        }

        # Dashboard
        location /dashboard/ {
            proxy_pass http://dashboard:80/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";

            location ~* /dashboard/.*\.(js|css|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
                set $upstream_dashboard http://dashboard:80;
                rewrite ^/dashboard/(.*)$ /$1 break;
                proxy_pass $upstream_dashboard;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header Connection "";
                add_header Cache-Control "public, max-age=31536000, immutable";
                access_log off;
            }
        }

        # Design Studio
        location /cds/ {
            proxy_pass http://cds:80/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";

            location ~* /cds/.*\.(js|css|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
                set $upstream_cds http://cds:80;
                rewrite ^/cds/(.*)$ /$1 break;
                proxy_pass $upstream_cds;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header Connection "";
                add_header Cache-Control "public, max-age=31536000, immutable";
                access_log off;
            }
        }

        # Chat (ionic)
        location = /chat/ {
            if ($arg_v = "") {
                return 302 /chat/?v=chatcase-20260508;
            }

            proxy_pass http://ionic:80/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location /chat/ {
            proxy_pass http://ionic:80/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";

            location ~* /chat/.*\.(js|css|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
                set $upstream_ionic http://ionic:80;
                rewrite ^/chat/(.*)$ /$1 break;
                proxy_pass $upstream_ionic;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header Connection "";
                add_header Cache-Control "public, max-age=31536000, immutable";
                access_log off;
            }
        }

        # API
        location /api/ {
            proxy_pass http://server:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Public backend modules (CaseZap webhooks and channel callbacks)
        location /modules/ {
            proxy_pass http://server:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # WebSocket - server
        location /ws/ {
            proxy_pass http://server:3000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /config.json {
            proxy_pass http://server:3000/chat21/config;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            add_header Cache-Control "public, max-age=300";
        }

        # Widget com CORS
        location /widget/ {
            if ($request_method = OPTIONS) {
                return 204;
            }

            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Max-Age 3600;
            add_header Access-Control-Expose-Headers Content-Length;
            add_header Access-Control-Allow-Headers Range;

            proxy_pass http://webwidget:80/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";

            location ~* /widget/.*\.(js|css|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
                set $upstream_widget http://webwidget:80;
                rewrite ^/widget/(.*)$ /$1 break;
                proxy_pass $upstream_widget;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header Connection "";
                add_header Cache-Control "public, max-age=86400";
                add_header Access-Control-Allow-Origin *;
                access_log off;
            }
        }

        location /widget-config.json {
            proxy_pass http://webwidget:80/widget-config.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        location /firebase-messaging-sw.js {
            proxy_pass http://ionic:80/firebase-messaging-sw.js;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        # Chat API
        location /chatapi/ {
            proxy_pass http://chat21httpserver:8004/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # MQTT WebSocket - RabbitMQ
        location /mqws/ {
            proxy_pass http://rabbitmq:15675/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
        }
    }
}
