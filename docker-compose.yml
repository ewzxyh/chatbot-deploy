volumes:
  tiledesk-datadb:
  redis-data:
services:
  dashboard:
    build: ../tiledesk-dashboard
    #image: "tiledesk/tiledesk-dashboard:2.7.134-stage"
    container_name: dashboard
    environment:
      - >-
        FEATURES_TOKEN=PAY:T-ANA:T-ACT:T-TRI:T-GRO:T-DEP:T-OPH:T-MTL:T-CAR:T-PSA:F-MTT:T-SUP:T-LBS:T-APP:T-DEV:F-NOT:T-IPS:F-ETK:F-RAS:F-PPB:F-PET:F-MTS:F-TIL:T-DGF:T-NAT:T-HPB:F-TOW:F-KNB:T-GPT:T-BAN:F-AST:F-MON:T-CNT:F-AUT:F-WUN:F-INT:T-DPA:T-QIN:T
      - BOT_CREDENTIAL_URL=/api/modules/dialogflow/botcredendials/
      - "WIDGET_LOCATION=${EXTERNAL_BASE_URL:-http://localhost:8081}/widget/"
      - SERVER_BASE_URL=/api/
      - CHAT_BASE_URL=/chat/?v=chatcase-20260508
      - CDS_BASE_URL=/cds/
      - WS_URL
      - WS_URL_RELATIVE=/ws/
      - BRAND_SRC
      - REMOTE_JS_SRC
      - CHAT21_ENGINE=mqtt
      - UPLOAD_ENGINE=native
      - PUSH_ENGINE=none
      - LOG_LEVEL=info
      - APPS_URL=/api/modules/apps/
      - PROMO_BANNER_URL
      - FIREBASE_APIKEY
      - FIREBASE_AUTHDOMAIN
      - FIREBASE_DATABASEURL
      - FIREBASE_PROJECT_ID
      - FIREBASE_STORAGEBUCKET
      - FIREBASE_MESSAGINGSENDERID
      - FIREBASE_APP_ID
      - FIREBASE_VAPID
      - API_BASEIMAGE_URL=/api/
      - COMMUNITY_TEMPLATES_URL=/api/modules/templates/public/community
      - TEMPLATES_URL=/api/modules/templates/public/templates
      - FILE_UPLOAD_ACCEPT=*/*
    ports:
      - "127.0.0.1:4500:80" # local direct access only; production should enter through proxy
    restart: unless-stopped
  cds:
    image: "tiledesk/design-studio:1.39.9-rc3"
    container_name: cds
    environment:
      - >-
        FEATURES_TOKEN=PAY:T-ANA:T-ACT:T-TRI:T-GRO:T-DEP:T-OPH:T-MTL:T-CAR:T-PSA:F-MTT:T-SUP:T-LBS:T-APP:T-DEV:F-NOT:T-IPS:F-ETK:F-RAS:F-PPB:F-PET:F-MTS:F-TIL:T-DGF:T-NAT:T-HPB:F-TOW:F-KNB:T-GPT:T-BAN:F-AST:F-MON:T-CNT:F-AUT:F-WUN:F-INT:T-DPA:T-QIN:T
      - "WIDGET_LOCATION=${EXTERNAL_BASE_URL:-http://localhost:8081}/widget/"
      - SERVER_BASE_URL=/api/
      - DASHBOARD_URL=/dashboard/
      - WS_URL
      - WS_URL_RELATIVE=/ws/
      - BRAND_SRC
      - REMOTE_JS_SRC
      - UPLOAD_ENGINE=native
      - LOG_LEVEL=info
      - FIREBASE_APIKEY
      - FIREBASE_AUTHDOMAIN
      - FIREBASE_DATABASEURL
      - FIREBASE_PROJECT_ID
      - FIREBASE_STORAGEBUCKET
      - FIREBASE_MESSAGINGSENDERID
      - FIREBASE_APP_ID
      - FIREBASE_VAPID
      - CDS_STORAGE_PREFIX=cds_sv5
      - API_BASEIMAGE_URL=/api/
      - FILE_UPLOAD_ACCEPT=*/*
      - >-
        AI_MODELS=gpt-5:4;gpt-5-mini:0.8;gpt-5-nano:0.16;gpt-4.1:3;gpt-4.1-mini:0.6;gpt-4.1-nano:0.16;gpt-4o:4;gpt-4o-mini:0.3;gpt-4:25;gpt-4-turbo-preview:12;gpt-3.5-turbo:0.6
      - MQTT_APPID=tilechat
      - "MQTT_ENDPOINT=${EXTERNAL_MQTT_BASE_URL:-}/mqws/ws"
    ports:
      - "127.0.0.1:4502:80" # local direct access only; production should enter through proxy
    restart: unless-stopped
  webwidget:
    image: "chat21/chat21-web-widget:5.1.2"
    container_name: chat21-web-widget
    ports:
      - "127.0.0.1:4200:80"
    environment:
      - CHAT21_ENGINE=mqtt
      - MQTT_APPID=tilechat
      - PUSH_ENGINE=none
      - LOG_LEVEL=info
      - "MQTT_ENDPOINT=${EXTERNAL_MQTT_BASE_URL:-}/mqws/ws"
      - "MQTT_APIENDPOINT=${EXTERNAL_BASE_URL:-http://localhost:8081}/chatapi/api"
      #- MQTT_LOGINSERVICE_ENDPOINT=/api/chat21/native/auth/createCustomToken
      - FIREBASE_APIKEY
      - FIREBASE_AUTHDOMAIN
      - FIREBASE_DATABASEURL
      - FIREBASE_PROJECT_ID
      - FIREBASE_STORAGEBUCKET
      - FIREBASE_MESSAGINGSENDERID
      - FIREBASE_TENANT=tilechat
      - UPLOAD_ENGINE=native
      - "SERVER_BASE_URL=${EXTERNAL_BASE_URL:-http://localhost:8081}/api/"
      - "TRANSLATIONS_URL=${EXTERNAL_BASE_URL:-http://localhost:8081}/api/"
      - "API_BASEIMAGE_URL=${EXTERNAL_BASE_URL:-http://localhost:8081}/api/"
      - DASHBOARD_URL=/dashboard/
      - AUTH_PERSISTENCE=LOCAL
      - ENBED_JS=true
      - FILE_UPLOAD_ACCEPT=*/*
    restart: unless-stopped
  ionic:
    image: "chat21/chat21-ionic:3.4.22"
    container_name: chat21-ionic
    volumes:
      - ./ionic-rebrand.sh:/docker-entrypoint.d/99-rebrand.sh:ro
      - ../tiledesk-dashboard/src/assets/img/logos/favicon.ico:/usr/share/nginx/html/assets/icon/favicon.ico:ro
      - ../tiledesk-dashboard/src/assets/img/logos/chatcase-icon-white.png:/usr/share/nginx/html/img/logo.png:ro
      - ../tiledesk-dashboard/src/assets/img/logos/chatcase-icon-white.png:/usr/share/nginx/html/img/splash.png:ro
      - ../tiledesk-dashboard/src/assets/img/logos/chatcase-logo.svg:/usr/share/nginx/html/assets/logos/tiledesk_logo.svg:ro
      - ../tiledesk-dashboard/src/assets/img/logos/chatcase-icon.svg:/usr/share/nginx/html/assets/logos/tiledesk_logo_no_text.svg:ro
      - ../tiledesk-dashboard/src/assets/img/logos/chatcase-icon.svg:/usr/share/nginx/html/assets/logos/tiledesk-solo-logo.png:ro
      - ../tiledesk-dashboard/src/assets/img/logos/chatcase-logo-white.svg:/usr/share/nginx/html/assets/logos/tiledesk-logo_new_white.svg:ro
      - ../tiledesk-dashboard/src/assets/img/logos/chatcase-logo-white.svg:/usr/share/nginx/html/assets/logos/tiledesk_logo_white_small.svg:ro
    ports:
      - "127.0.0.1:8082:80" # local direct access only; production should enter through proxy
    environment:
      - DASHBOARD_URL=/dashboard/
      - API_BASEIMAGE_URL=/api/
      - SERVER_BASE_URL=/api/
      - >-
        FEATURES_TOKEN=PAY:T-ANA:T-ACT:T-TRI:T-GRO:T-DEP:T-OPH:T-MTL:T-CAR:T-PSA:F-MTT:T-SUP:T-LBS:T-APP:T-DEV:F-NOT:T-IPS:F-ETK:F-RAS:F-PPB:F-PET:F-MTS:F-TIL:T-DGF:T-NAT:T-HPB:F-TOW:F-KNB:T-GPT:T-BAN:F-AST:F-MON:T-CNT:F-AUT:F-WUN:F-INT:T-DPA:T-QIN:T
      - WIDGET_LOCATION=/widget/
      - PUSH_ENGINE=none
      - LOG_LEVEL=info
      - FILE_UPLOAD_ACCEPT=*/*
      - CHAT21_ENGINE=mqtt
      - MQTT_APPID=tilechat
      - "MQTT_ENDPOINT=${EXTERNAL_MQTT_BASE_URL:-}/mqws/ws"
      - MQTT_APIENDPOINT=/chatapi/api
      - UPLOAD_ENGINE=native
      - FIREBASE_APIKEY
      - FIREBASE_AUTHDOMAIN
      - FIREBASE_DATABASEURL
      - FIREBASE_PROJECT_ID
      - FIREBASE_STORAGEBUCKET
      - FIREBASE_MESSAGINGSENDERID
      - FIREBASE_TENANT=tilechat
      - FIREBASE_VAPID
      - SUPPORT_MODE=true
      - WRITE_TO_BUTTON=true
      - ARCHIVED_BUTTON=true
      - AUTH_PERSISTENCE=LOCAL
      - EMAIL_SECTION=true
      - CHAT_STORAGE_PREFIX=chat_sv5
      - WS_URL_RELATIVE=/ws/
    command: >-
      /bin/sh -c "envsubst < /usr/share/nginx/html/chat-config-template.json > /usr/share/nginx/html/chat-config.json &&
      envsubst < /usr/share/nginx/html/firebase-messaging-sw-template.js > /usr/share/nginx/html/firebase-messaging-sw.js &&
      sh /docker-entrypoint.d/99-rebrand.sh &&
      exec nginx -g 'daemon off;'"
    restart: unless-stopped
  chatbot:
    image: "tiledesk/tiledesk-chatbot:2.0.32-rc8"
    container_name: chatbot
    environment:
      - "API_ENDPOINT=http://server:3000"
      - "TILEBOT_ENDPOINT=http://chatbot:3000"
      - "API_URL=${EXTERNAL_BASE_URL:-http://localhost:8081}/api"
      - "MONGODB_URI=${TILEDESK_MONGODB_URI:-mongodb://mongo/tiledesk}"
      - CACHE_ENABLED=true
      - CACHE_REDIS_HOST=redis
      - CACHE_REDIS_PORT=6379
      - CACHE_REDIS_PASSWORD
      - TILEBOT_LOG=info
      - FLOW_LOGS_ENABLED=true
      - >-
        AMQP_MANAGER_URL=${AMQP_MANAGER_URL:-[REDACTED_CREDENTIAL_URL]
      - "AI_ENDPOINT=http://backend-llm-train:8000/api"
      - "GPTKEY=${GPTKEY:-CHANGEIT}"
      - "KB_ENDPOINT_TRAIN=http://backend-llm-train:8000/api"
      - "KB_ENDPOINT_QA=http://backend-llm-qa:8000/api"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  server:
    build: ../tiledesk-server
    #image: "tiledesk/tiledesk-server:2.13.23-op1"
    container_name: server
    restart: always
    environment:
      - LOG_LEVEL=info
      - CHAT21_ENABLED=true
      - CHAT21_ENGINE=mqtt
      - "CHAT21_URL=http://chat21httpserver:8004"
      - "CHAT21_JWT_SECRET=${CHAT21_JWT_SECRET:-tokenKey}"
      - CHAT21_APPID=tilechat
      - RESTHOOK_ENABLED=true
      - ALLOW_REOPEN_CHAT=true
      - >-
        CHAT21_ADMIN_TOKEN=${CHAT21_ADMIN_TOKEN:-[REDACTED_JWT]}
      - >-
        AMQP_MANAGER_URL=${AMQP_MANAGER_URL:-[REDACTED_CREDENTIAL_URL]
      - "MONGODB_URI=${TILEDESK_MONGODB_URI:-mongodb://mongo/tiledesk}"
      - "MONGODB_LOGS_URI=${TILEDESK_LOGS_MONGODB_URI:-mongodb://mongo/tiledesk-logs}"
      - EMAIL_ENABLED
      - EMAIL_HOST
      - EMAIL_USERNAME
      - EMAIL_SECURE
      - EMAIL_PORT
      - EMAIL_PASSWORD
      - EMAIL_FROM_ADDRESS
      - "EMAIL_BASEURL=${EXTERNAL_BASE_URL:-http://localhost:8081}/dashboard"
      - "WEBHOOK_ORIGIN=${EXTERNAL_BASE_URL:-http://localhost:8081}/api/"
      - "WIDGET_LOCATION=${EXTERNAL_BASE_URL:-http://localhost:8081}/widget/"
      - WS_SERVER_PATH
      #PLEASE DON'T PASTE THE LICENSE KEY HERE USE .ENV FILE. DOCKER ISSUE WITH /n char
      - LICENSE_KEY
      - CACHE_ENABLED=true
      - CACHE_ENGINE=redis
      - CACHE_REDIS_HOST=redis
      - CACHE_REDIS_PORT=6379
      - CACHE_REDIS_PASSWORD
      - OPERATIONAL_RABBITMQ_QUEUES=jobsmanager,webhooks,messages,logs_queue,conversation-tags_queue
      - OPERATIONAL_QUEUE_READY_ALERT_THRESHOLD=100
      - "APPS_ACCESS_TOKEN_SECRET=${APPS_ACCESS_TOKEN_SECRET:-nodeauthsecret}"
      - BOOT_LOADING=true
      - "META_GRAPH_URL=https://graph.facebook.com/v20.0/"
      - "TELEGRAM_API_URL=https://api.telegram.org/bot"
      - "TELEGRAM_FILE_URL=https://api.telegram.org/file/bot"
      - TELEGRAM_LOG=info
      - "FB_APP_ID=${FB_APP_ID:-1323406253048999}"
      - "FB_APP_SECRET=${FB_APP_SECRET:REDACTED_SECRET}"
      - "CONFIGURATION_ID=${META_CONFIGURATION_ID:-1390646346161509}"
      - "VERIFY_TOKEN=${VERIFY_TOKEN:-chatcase_verify_2026}"
      - "BASE_FILE_URL=${EXTERNAL_BASE_URL:-http://localhost:8081}/api/"
      - "FILE_STORAGE_DRIVER=${FILE_STORAGE_DRIVER:-gridfs}"
      - R2_ENABLED
      - R2_ACCOUNT_ID
      - R2_ENDPOINT
      - R2_BUCKET
      - R2_ACCESS_KEY_ID
      - R2_SECRET_ACCESS_KEY
      - "R2_REGION=${R2_REGION:-auto}"
      - R2_KEY_PREFIX
      - "GPTKEY=${GPTKEY:-CHANGEIT}"
      - >-
        AI_MODELS=gpt-5:4;gpt-5-mini:0.8;gpt-5-nano:0.16;gpt-4.1:3;gpt-4.1-mini:0.6;gpt-4.1-nano:0.16;gpt-4o:4;gpt-4o-mini:0.3;gpt-4:25;gpt-4-turbo-preview:12;gpt-3.5-turbo:0.6
      - "OPENAI_ENDPOINT=https://api.openai.com/v1"
      - "KB_ENDPOINT_TRAIN=http://backend-llm-train:8000/api"
      - "KB_ENDPOINT_QA=http://backend-llm-qa:8000/api"
      - VECTOR_STORE_NAME=qdrant
      - INDEX_TYPE=serverless
      - INDEX_NAME=tiledesk-llm
      - VECTOR_SIZE=1536
      - VECTOR_STORE_HOST=qdrant
      - VECTOR_STORE_PORT=6333
      - VECTOR_STORE_DEPLOYMENT=local
      - JOB_TOPIC_EXCHANGE_TRAIN=tiledesk-trainer
      - "JWT_SECRET_KEY=${JWT_SECRET_KEY:-tokenKey}"
      - COMMUNITY_VERSION=false
      - QUOTES_ENABLED=true
      - TRIAL_MODE_ENABLED=true
      - "ADMIN_EMAIL=${ADMIN_EMAIL:redacted@example.invalid}"
      - "SUPER_ADMIN_EMAILS=${SUPER_ADMIN_EMAILS:redacted@example.invalid,redacted@example.invalid}"
      - CASEPAY_API_KEY
      - CASEPAY_CONNECTION_ID
      - CASEPAY_WEBHOOK_SECRET
      - "TILEBOT_ENDPOINT=http://chatbot:3000"
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
          test: ["CMD", "curl", "-f", "http://localhost:3000/"]
          interval: 10s
          timeout: 5s
          retries: 5
          start_period: 40s
  chat21httpserver:
    image: "chat21/chat21-http-server:0.2.37"
    #image: chat21http-gab:0.1.11
    container_name: chat21httpserver
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      #- AUTO_RESTART=false
      - "MONGODB_URI=${CHAT21_MONGODB_URI:-mongodb://mongo/chat21}"
      - "JWT_KEY=${CHAT21_JWT_SECRET:-tokenKey}"
      - >-
        RABBITMQ_URI=${RABBITMQ_URI:-[REDACTED_CREDENTIAL_URL]
      - PUSH_ENABLED=true
      - FIREBASE_PRIVATE_KEY
      - FIREBASE_APIKEY
      - FIREBASE_PROJECT_ID
      - FIREBASE_CLIENT_EMAIL
      - >-
        PUSH_WH_CHAT21_API_ADMIN_TOKEN=${PUSH_WH_CHAT21_API_ADMIN_TOKEN:-[REDACTED_JWT]}
      - "PUSH_WH_NOTIFY_URL=${PUSH_WH_NOTIFY_URL:-http://chat21httpserver:8004/api/tilechat/notify}"
      - >-
        PUSH_WH_WEBHOOK_TOKEN=${PUSH_WH_WEBHOOK_TOKEN:-WHFyAhecCMkYsvldLFWbSrJt7lAZFAmrp7O5QVMvGQsLVn9SkfT}
      - CHAT21HTTP_CACHE_ENABLED=false
      - "CONTACTS_LOOKUP_ENDPOINT=http://server:3000/users_util"
    depends_on:
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:8004:8004"
  chat21server:
    image: "chat21/chat21-server:0.2.53"
    container_name: chat21server
    restart: unless-stopped
    environment:
      #- AUTO_RESTART=false
      - LOG_LEVEL=info
      - "MONGODB_URI=${CHAT21_MONGODB_URI:-mongodb://mongo/chat21}"
      - APP_ID=tilechat
      - >-
        WEBHOOK_ENDPOINTS=http://server:3000/chat21/requests,http://chat21httpserver:8004/api/tilechat/push/webhook/endpoint/${PUSH_WH_WEBHOOK_TOKEN:-WHFyAhecCMkYsvldLFWbSrJt7lAZFAmrp7O5QVMvGQsLVn9SkfT}
      - WEBHOOK_ENABLED=true
      - "WEBHOOK_EVENTS=message-sent,message-delivered,conversation-unarchived"
      - >-
        RABBITMQ_URI=${RABBITMQ_URI:-[REDACTED_CREDENTIAL_URL]
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_started
      server:
        condition: service_started
  backend-llm-train:
    image: "tiledesk/tiledesk-backend-llm:0.5.3-rc1"
    container_name: backend-llm-train
    environment:
      - TIMEOUT=240
      # - 'REDIS_URL=redis://host.docker.internal:6379'
      - "REDIS_URL=${REDIS_URL:-redis://redis:6379}"
      - TILELLM_ROLE=train
      - WORKERS=3
      # WORKER_CONFIGURATION
      - "MONGODB_URL=${TILEDESK_MONGODB_URI:-mongodb://mongo/tiledesk}"
      - >-
        AMQP_MANAGER_URL=${AMQP_MANAGER_URL:-[REDACTED_CREDENTIAL_URL]
      - JOB_TOPIC_EXCHANGE_TRAIN=tiledesk-trainer
      - "GPTKEY=${GPTKEY:-CHANGEIT}"
      - TRAIN_PREFETCH=4
      - "JWT_SECRET_KEY=${JWT_SECRET_KEY:-tokenKey}"
      - TRAINER_LOG=info
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3007:8000"
      - "127.0.0.1:3009:3009"
    restart: unless-stopped
  backend-llm-qa:
    image: "tiledesk/tiledesk-backend-llm:0.5.3-rc1"
    container_name: backend-llm-qa
    environment:
      - TIMEOUT=240
      # - 'REDIS_URL=redis://host.docker.internal:6379'
      - "REDIS_URL=${REDIS_URL:-redis://redis:6379}"
      - TILELLM_ROLE=qa
      - WORKERS=3
      # WORKER_CONFIGURATION
      - "MONGODB_URL=${TILEDESK_MONGODB_URI:-mongodb://mongo/tiledesk}"
      - >-
        AMQP_MANAGER_URL=${AMQP_MANAGER_URL:-[REDACTED_CREDENTIAL_URL]
      - JOB_TOPIC_EXCHANGE_TRAIN=tiledesk-trainer
      - "GPTKEY=${GPTKEY:-CHANGEIT}"
      - TRAIN_PREFETCH=4
      - "JWT_SECRET_KEY=${JWT_SECRET_KEY:-tokenKey}"
      - TRAINER_LOG=info
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
          condition: service_healthy
    ports:
      - "127.0.0.1:3008:8000"
    restart: unless-stopped
  proxy:
    image: "tiledesk/tiledesk-docker-proxy:v1.1.2"
    container_name: tiledesk-docker-proxy
    volumes:
      - ./proxy-nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${PROXY_HTTP_BIND:-8081}:80"
    depends_on:
      server:
        condition: service_healthy
      dashboard:
        condition: service_started
      webwidget:
        condition: service_started
      chat21httpserver:
        condition: service_started
      rabbitmq:
        condition: service_started
      cds:
        condition: service_started
    restart: unless-stopped
    command:
      - nginx
      - "-g"
      - daemon off;
  qdrant:
    image: "qdrant/qdrant:latest"
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - "./qdrant_storage:/qdrant/storage"
    restart: unless-stopped
  rabbitmq:
    image: chat21/chat21-rabbitmq
    container_name: rabbitmq
    volumes:
      - ./rabbitmq-configure-and-start.sh:/usr/local/bin/chatcase-rabbitmq-configure-and-start.sh:ro
    environment:
      RABBITMQ_ERLANG_COOKIE: "${RABBITMQ_ERLANG_COOKIE:-chatcase-dev-cookie}"
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-admin}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-change-me}"
      RABBITMQ_JWT_SECRET: "${CHAT21_JWT_SECRET:-tokenKey}"
    command: ["/bin/sh", "/usr/local/bin/chatcase-rabbitmq-configure-and-start.sh"]
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:15675:15675"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
    # healthcheck:
    #     test: [ "CMD", "nc", "-z", "localhost", "5672" ]
    #     interval: 5s
    #     timeout: 15s
    #     retries: 1
  mongo:
    container_name: mongo
    image: "mongo:7.0.2"
    command: "--bind_ip_all"
    volumes:
      - "tiledesk-datadb:/data/db"
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    # healthcheck:
    #   test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 5
  redis:
    container_name: redis
    image: "redis:7.0.5"
    volumes:
      - "redis-data:/data"
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
          test: ["CMD", "redis-cli", "ping"]
          interval: 5s
          timeout: 3s
          retries: 5
          start_period: 5s
    # healthcheck:
    #   test: ["CMD", "redis-cli", "ping"]
    #   interval: 5s
    #   timeout: 3s
    #   retries: 5

  #ngrok:
  #  container_name: ngrok
  #  image: wernight/ngrok
  #  command: ngrok http server:3000
  #  ports:
  #   -  '4040:4040'
